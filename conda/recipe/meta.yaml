{% set name = "empyrical-reloaded" %}
{% set version = environ["EMPYRICAL_VERSION"] %}
{% set source_sha256 = environ["EMPYRICAL_SDIST_SHA256"] %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.io/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: {{ source_sha256 }}

build:
  number: 0
  noarch: python
  skip: true # [py<311]
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv

requirements:
  host:
    - python >=3.11
    - pip
    - setuptools
    - setuptools-scm
  run:
    - python >=3.11
    - numpy >=1.26
    - pandas >=2.2.2
    - scipy >=0.15.1
    - bottleneck >=1.3.0
    - peewee
    - pytz
    - yfinance >=0.1.63
    - pandas-datareader >=0.4

test:
  imports:
    - empyrical

about:
  home: https://empyrical.ml4trading.io
  summary: 'Common financial risk metrics'
  license: Apache-2.0
  license_file: LICENSE
