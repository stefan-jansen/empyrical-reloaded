name: CI Tests

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * 6"
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  black-format:
    name: Formatting Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: psf/black@stable
        with:
          options: "--check --diff"
          src: "./src ./tests"
          version: "24.4.2"

  flake8-lint:
    name: Lint Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: flake8 Lint
        uses: py-actions/flake8@v2

  tests:
    permissions:
      contents: read
      id-token: write
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
        python-version: [ "3.11", "3.12", "3.13", "3.14", "3.15" ]
    steps:
      - name: Checkout empyrical
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install empyrical
        run: |
          python -VV
          python -m pip install --upgrade pip setuptools wheel
          pip install tox tox-gh-actions
          pip install -e ".[test]"

      - name: Unittests with tox & pytest
        run: tox

      - name: Upload coverage data to Codecov
        if: ${{ matrix.os == 'ubuntu-latest' }}
        uses: codecov/codecov-action@v7
        with:
          use_oidc: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          fail_ci_if_error: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          name: codecov-umbrella
          verbose: true
