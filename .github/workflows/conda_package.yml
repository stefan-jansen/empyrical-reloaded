name: Anaconda

on:
  workflow_dispatch:
    inputs:
      version:
        description: Published source version
        required: true
        type: string
      sdist_sha256:
        description: SHA256 of the published source distribution
        required: true
        type: string

jobs:
  build:
    name: Build Python 3.11+ noarch package
    runs-on: ubuntu-latest
    env:
      EMPYRICAL_VERSION: ${{ inputs.version }}
      EMPYRICAL_SDIST_SHA256: ${{ inputs.sdist_sha256 }}
      ANACONDA_API_TOKEN: ${{ secrets.ANACONDA_TOKEN }}
    defaults:
      run:
        shell: bash -l {0}
    steps:
      - uses: actions/checkout@v7
      - name: Setup build environment
        uses: conda-incubator/setup-miniconda@v4
        with:
          miniconda-version: latest
          auto-update-conda: true
          channel-priority: true
          mamba-version: "*"
          python-version: "3.11"
          activate-environment: recipe
          channels: ml4t, conda-forge, defaults, anaconda, ranaroussi
      - name: Build from the pinned published source
        run: |
          mamba install -n recipe boa conda-verify anaconda-client
          conda mambabuild --output-folder . --python 3.11 conda/recipe
      - uses: actions/upload-artifact@v7
        with:
          name: empyrical-conda
          path: noarch/*
      - name: Upload package
        run: anaconda upload -l main -u ml4t noarch/*
