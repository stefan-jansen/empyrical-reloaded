name: Test Wheels

on:
  workflow_dispatch:
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build distribution artifacts
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: empyrical-wheels
          path: dist/*

  test_wheels:
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@v8
        with:
          name: empyrical-wheels
          path: dist
      - name: Install built wheel and declared test dependencies
        run: |
          python -m pip install --upgrade pip
          python -c "import glob, subprocess, sys; wheel, = glob.glob('dist/*.whl'); subprocess.check_call([sys.executable, '-m', 'pip', 'install', wheel + '[test]'])"
      - name: Test installed public package
        run: |
          python -c "from pathlib import Path; import empyrical; path = Path(empyrical.__file__).resolve(); print(path); assert Path('src/empyrical').resolve() not in path.parents"
          python -m pytest -o pythonpath= tests
