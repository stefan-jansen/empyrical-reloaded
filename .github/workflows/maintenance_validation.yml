name: Maintenance candidate validation

on:
  push:
    branches: [codex/maintenance-release-candidate, codex/python311-support]

jobs:
  supported-tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install native test tools
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install tox tox-gh-actions
          python -m pip install -e ".[test]"
      - name: Run supported tox environments
        run: tox
      - name: Create artifact probe
        run: python -c "from pathlib import Path; Path('probe.txt').write_text('empyrical-artifact-roundtrip\n')"
      - uses: actions/upload-artifact@v7
        with:
          name: probe-${{ matrix.os }}-${{ matrix.python-version }}
          path: probe.txt

  artifact-handoff:
    needs: supported-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: probe-*
          path: downloaded-probe
      - name: Verify completed producer artifacts
        run: |
          python - <<'PYTHON'
          from pathlib import Path
          probes = list(Path("downloaded-probe").glob("probe-*/probe.txt"))
          assert len(probes) == 15, probes
          assert all(p.read_text() == "empyrical-artifact-roundtrip\n" for p in probes)
          PYTHON

  built-wheel-tests:
    uses: ./.github/workflows/test_wheels.yml
